services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: framework
      POSTGRES_PASSWORD: framework
      POSTGRES_DB: framework
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framework -d framework"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - framework_postgres:/var/lib/postgresql/data

  redis:
    profiles: ["scale"]
    image: redis:8.2.9-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  framework_postgres:
